name: Firmware formatting

on:
  pull_request:
    paths:
      - 'software/front/US_Firmware.X/**'
      - '.clang-format'
      - 'tools/format_firmware.py'
      - 'tools/requirements-format.txt'
      - '.github/workflows/format-firmware.yaml'
  push:
    paths:
      - 'software/front/US_Firmware.X/**'
      - '.clang-format'
      - 'tools/format_firmware.py'
      - 'tools/requirements-format.txt'
      - '.github/workflows/format-firmware.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-format.txt
      - run: python tools/format_firmware.py --check
