# Build the software/PC dotnet applications

name: Windows Unisolder application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    # Build the application
    - name: Build with MSBuild
      working-directory: software/PC
      run: msbuild /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:OutputPath=bin/Release /p:DeployOnBuild=true /p:PublishProfile=Properties\PublishProfiles\UnisolderApp.pubxml /p:PublishDir=bin/Release /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl=bin/Release /p:VisualStudioVersion=16.0 /p:DeployDefaultTarget=WebPublish
    # Archive the build
    - name: Archive build
      uses: actions/upload-artifact@v7
      with:
        name: Unisolder-WindowsApp
        path: software/PC/UniSolder/bin/Release